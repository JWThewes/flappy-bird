<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
class GameScene extends Phaser.Scene {
  constructor() {
    super('GameScene')
  }

  preload() {
    // Generate all textures programmatically in create() — no external assets needed
  }

  create() {
    // Game constants
    this.GRAVITY = 900
    this.FLAP_VELOCITY = -330
    this.PIPE_SPEED = -200
    this.PIPE_SPAWN_INTERVAL = 1600
    this.PIPE_GAP = 140
    this.PIPE_WIDTH = 52
    this.GROUND_HEIGHT = 80
    this.BIRD_RADIUS = 15

    // Game state: 'READY', 'PLAYING', 'GAMEOVER'
    this.gameState = 'READY'
    this.score = 0
    this.canRestart = false

    // Create programmatic textures
    this.createTextures()

    // Create background gradient
    this.createBackground()

    // Create ground
    this.createGround()

    // Create bird
    this.createBird()

    // Create pipe groups
    this.pipes = this.physics.add.group()
    this.scoreZones = this.physics.add.group()

    // Create UI text
    this.createUI()

    // Set up input
    this.setupInput()

    // Set up collisions
    this.setupCollisions()

    // Pipe spawn timer (starts paused)
    this.pipeTimer = this.time.addEvent({
      delay: this.PIPE_SPAWN_INTERVAL,
      callback: this.spawnPipePair,
      callbackScope: this,
      loop: true,
      paused: true
    })
  }

  createTextures() {
    // Bird texture — yellow circle with an eye
    const birdGfx = this.make.graphics({ x: 0, y: 0, add: false })
    birdGfx.fillStyle(0xf5c842, 1)
    birdGfx.fillCircle(this.BIRD_RADIUS, this.BIRD_RADIUS, this.BIRD_RADIUS)
    // Eye
    birdGfx.fillStyle(0xffffff, 1)
    birdGfx.fillCircle(this.BIRD_RADIUS + 5, this.BIRD_RADIUS - 4, 5)
    birdGfx.fillStyle(0x000000, 1)
    birdGfx.fillCircle(this.BIRD_RADIUS + 7, this.BIRD_RADIUS - 4, 2.5)
    // Beak
    birdGfx.fillStyle(0xe87d22, 1)
    birdGfx.fillTriangle(
      this.BIRD_RADIUS + 12, this.BIRD_RADIUS + 2,
      this.BIRD_RADIUS + 22, this.BIRD_RADIUS + 5,
      this.BIRD_RADIUS + 12, this.BIRD_RADIUS + 8
    )
    birdGfx.generateTexture('bird', this.BIRD_RADIUS * 2 + 12, this.BIRD_RADIUS * 2 + 2)
    birdGfx.destroy()

    // Pipe texture — green rectangle
    const pipeGfx = this.make.graphics({ x: 0, y: 0, add: false })
    pipeGfx.fillStyle(0x3cbf3c, 1)
    pipeGfx.fillRect(0, 0, this.PIPE_WIDTH, 400)
    // Darker edge
    pipeGfx.fillStyle(0x2a9e2a, 1)
    pipeGfx.fillRect(0, 0, 4, 400)
    pipeGfx.fillRect(this.PIPE_WIDTH - 4, 0, 4, 400)
    // Cap
    pipeGfx.fillStyle(0x3cbf3c, 1)
    pipeGfx.fillRect(-3, 0, this.PIPE_WIDTH + 6, 26)
    pipeGfx.fillStyle(0x2a9e2a, 1)
    pipeGfx.fillRect(-3, 0, 4, 26)
    pipeGfx.fillRect(this.PIPE_WIDTH + 3 - 4, 0, 4, 26)
    pipeGfx.generateTexture('pipe', this.PIPE_WIDTH + 6, 400)
    pipeGfx.destroy()

    // Ground texture — brown/green stripe
    const groundGfx = this.make.graphics({ x: 0, y: 0, add: false })
    groundGfx.fillStyle(0xded895, 1)
    groundGfx.fillRect(0, 0, 400, this.GROUND_HEIGHT)
    groundGfx.fillStyle(0x54a832, 1)
    groundGfx.fillRect(0, 0, 400, 16)
    groundGfx.generateTexture('ground', 400, this.GROUND_HEIGHT)
    groundGfx.destroy()
  }

  createBackground() {
    // Simple sky gradient is already set via backgroundColor in config
    // Add a few decorative clouds
    const cloudGfx = this.make.graphics({ x: 0, y: 0, add: false })
    cloudGfx.fillStyle(0xffffff, 0.8)
    cloudGfx.fillEllipse(30, 15, 60, 30)
    cloudGfx.fillEllipse(55, 12, 40, 24)
    cloudGfx.fillEllipse(10, 18, 35, 20)
    cloudGfx.generateTexture('cloud', 80, 35)
    cloudGfx.destroy()

    this.add.image(80, 100, 'cloud').setAlpha(0.7)
    this.add.image(260, 60, 'cloud').setAlpha(0.5).setScale(1.3)
    this.add.image(350, 150, 'cloud').setAlpha(0.6).setScale(0.8)
  }

  createGround() {
    const groundY = this.game.config.height - this.GROUND_HEIGHT
    this.ground = this.physics.add.staticImage(200, groundY + this.GROUND_HEIGHT / 2, 'ground')
    this.ground.setDisplaySize(400, this.GROUND_HEIGHT)
    this.ground.refreshBody()
  }

  createBird() {
    const startX = 100
    const startY = 250
    this.bird = this.physics.add.sprite(startX, startY, 'bird')
    this.bird.setOrigin(0.35, 0.5)
    this.bird.body.setCircle(this.BIRD_RADIUS, 0, 0)
    this.bird.body.allowGravity = false
    this.bird.setDepth(10)

    // Idle bob tween for READY state
    this.idleTween = this.tweens.add({
      targets: this.bird,
      y: startY - 10,
      duration: 500,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    })
  }

  createUI() {
    // Score text
    this.scoreText = this.add.text(200, 50, '0', {
      fontSize: '48px',
      fontFamily: 'Arial, sans-serif',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(20).setVisible(false)

    // Ready text
    this.readyText = this.add.text(200, 200, 'Tap to Start', {
      fontSize: '32px',
      fontFamily: 'Arial, sans-serif',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(20)

    // Game over text
    this.gameOverText = this.add.text(200, 200, 'Game Over', {
      fontSize: '40px',
      fontFamily: 'Arial, sans-serif',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(20).setVisible(false)

    // Final score text
    this.finalScoreText = this.add.text(200, 260, '', {
      fontSize: '28px',
      fontFamily: 'Arial, sans-serif',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(20).setVisible(false)

    // Restart text
    this.restartText = this.add.text(200, 320, 'Tap to Restart', {
      fontSize: '24px',
      fontFamily: 'Arial, sans-serif',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 2
    }).setOrigin(0.5).setDepth(20).setVisible(false)
  }

  setupInput() {
    this.input.on('pointerdown', this.handleInput, this)
    this.input.keyboard.on('keydown-SPACE', this.handleInput, this)
  }

  handleInput() {
    if (this.gameState === 'READY') {
      this.startPlaying()
    } else if (this.gameState === 'PLAYING') {
      this.flap()
    } else if (this.gameState === 'GAMEOVER' && this.canRestart) {
      this.restartGame()
    }
  }

  startPlaying() {
    this.gameState = 'PLAYING'

    // Stop idle tween and enable gravity on bird
    this.idleTween.stop()
    this.bird.body.allowGravity = true

    // Hide ready text, show score
    this.readyText.setVisible(false)
    this.scoreText.setVisible(true)

    // Start pipe spawner
    this.pipeTimer.paused = false

    // First flap
    this.flap()
  }

  flap() {
    if (this.gameState !== 'PLAYING') return
    this.bird.body.setVelocityY(this.FLAP_VELOCITY)
  }

  setupCollisions() {
    // Bird vs Ground
    this.physics.add.collider(this.bird, this.ground, this.hitObstacle, null, this)
    // Bird vs Pipes — use overlap for immediate detection
    this.physics.add.overlap(this.bird, this.pipes, this.hitObstacle, null, this)
    // Bird vs Score Zones
    this.physics.add.overlap(this.bird, this.scoreZones, this.collectScore, null, this)
  }

  spawnPipePair() {
    if (this.gameState !== 'PLAYING') return

    const gameHeight = this.game.config.height
    const groundTop = gameHeight - this.GROUND_HEIGHT
    const minGapY = 80 + this.PIPE_GAP / 2
    const maxGapY = groundTop - 80 - this.PIPE_GAP / 2
    const gapCenterY = Phaser.Math.Between(minGapY, maxGapY)

    const pipeX = this.game.config.width + this.PIPE_WIDTH / 2 + 10

    // Top pipe (grows downward from top)
    const topPipeHeight = gapCenterY - this.PIPE_GAP / 2
    const topPipe = this.pipes.create(pipeX, topPipeHeight / 2, 'pipe')
    topPipe.setDisplaySize(this.PIPE_WIDTH, topPipeHeight)
    topPipe.body.allowGravity = false
    topPipe.body.setVelocityX(this.PIPE_SPEED)
    topPipe.setFlipY(true)
    topPipe.body.setSize(this.PIPE_WIDTH - 8, topPipeHeight)
    topPipe.setImmovable(true)

    // Bottom pipe (grows upward from ground)
    const bottomPipeY = gapCenterY + this.PIPE_GAP / 2
    const bottomPipeHeight = groundTop - bottomPipeY
    const bottomPipe = this.pipes.create(pipeX, bottomPipeY + bottomPipeHeight / 2, 'pipe')
    bottomPipe.setDisplaySize(this.PIPE_WIDTH, bottomPipeHeight)
    bottomPipe.body.allowGravity = false
    bottomPipe.body.setVelocityX(this.PIPE_SPEED)
    bottomPipe.body.setSize(this.PIPE_WIDTH - 8, bottomPipeHeight)
    bottomPipe.setImmovable(true)

    // Invisible score zone — placed at right edge of pipe so bird passes through it
    const scoreZone = this.scoreZones.create(pipeX + this.PIPE_WIDTH / 2 + this.BIRD_RADIUS, gapCenterY, null)
    scoreZone.setDisplaySize(10, this.PIPE_GAP)
    scoreZone.body.allowGravity = false
    scoreZone.body.setVelocityX(this.PIPE_SPEED)
    scoreZone.setVisible(false)
    scoreZone.body.setSize(10, this.PIPE_GAP)
  }

  collectScore(bird, zone) {
    zone.destroy()
    this.score++
    this.scoreText.setText(this.score.toString())
  }

  hitObstacle() {
    if (this.gameState !== 'PLAYING') return
    this.triggerGameOver()
  }

  triggerGameOver() {
    this.gameState = 'GAMEOVER'
    this.canRestart = false

    // Stop pipe spawner
    this.pipeTimer.paused = true

    // Stop all pipe movement
    this.pipes.getChildren().forEach(pipe => {
      pipe.body.setVelocityX(0)
    })
    this.scoreZones.getChildren().forEach(zone => {
      zone.body.setVelocityX(0)
    })

    // Let bird fall to ground (gravity continues) but disable horizontal movement
    this.bird.body.setVelocityX(0)
    this.bird.body.setVelocityY(200)

    // Show game over UI
    this.gameOverText.setVisible(true)
    this.finalScoreText.setText('Score: ' + this.score).setVisible(true)

    // Delay before allowing restart
    this.time.delayedCall(800, () => {
      this.restartText.setVisible(true)
      this.canRestart = true
    })
  }

  restartGame() {
    // Reset everything by restarting the scene
    this.scene.restart()
  }

  update() {
    if (this.gameState !== 'PLAYING') return

    // Clamp bird at ceiling
    if (this.bird.y < this.BIRD_RADIUS) {
      this.bird.y = this.BIRD_RADIUS
      this.bird.body.setVelocityY(0)
    }

    // Rotate bird based on velocity for visual feedback
    const velocityY = this.bird.body.velocity.y
    if (velocityY < -100) {
      this.bird.angle = -20
    } else if (velocityY > 100) {
      this.bird.angle = Math.min(velocityY * 0.1, 70)
    } else {
      this.bird.angle = 0
    }

    // Clean up off-screen pipes and score zones
    this.pipes.getChildren().forEach(pipe => {
      if (pipe.x < -this.PIPE_WIDTH) {
        pipe.destroy()
      }
    })
    this.scoreZones.getChildren().forEach(zone => {
      if (zone.x < -50) {
        zone.destroy()
      }
    })
  }
}

const config = {
  type: Phaser.AUTO,
  width: 400,
  height: 600,
  parent: document.body,
  backgroundColor: '#71c5cf',
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 900 },
      debug: false
    }
  },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [GameScene]
}

const game = new Phaser.Game(config)
</script>
</body>
</html>
