<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird 3D</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="src/lighting.js"></script>
<script>
// --- Scene Setup ---
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 15);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Apply lighting, shadows, sky, and ground
setupLighting(scene, renderer);

// --- Procedural 3D Bird ---
function createBird() {
  const bird = new THREE.Group();

  // Body - yellow sphere
  const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8d830, roughness: 0.4, metalness: 0.1 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  bird.add(body);

  // Head - smaller sphere, positioned forward and up
  const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xf8d830, roughness: 0.4, metalness: 0.1 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(0.35, 0.25, 0);
  head.castShadow = true;
  bird.add(head);

  // Eye - white sphere with black pupil
  const eyeGeo = new THREE.SphereGeometry(0.12, 12, 12);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(0.55, 0.35, 0.2);
  bird.add(eye);

  const pupilGeo = new THREE.SphereGeometry(0.06, 10, 10);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const pupil = new THREE.Mesh(pupilGeo, pupilMat);
  pupil.position.set(0.62, 0.35, 0.22);
  bird.add(pupil);

  // Beak - orange cone
  const beakGeo = new THREE.ConeGeometry(0.12, 0.35, 8);
  const beakMat = new THREE.MeshStandardMaterial({ color: 0xf85030, roughness: 0.5 });
  const beak = new THREE.Mesh(beakGeo, beakMat);
  beak.rotation.z = -Math.PI / 2;
  beak.position.set(0.75, 0.15, 0);
  beak.castShadow = true;
  bird.add(beak);

  // Wing - flattened box
  const wingGeo = new THREE.BoxGeometry(0.4, 0.08, 0.6);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xe8a020, roughness: 0.4, metalness: 0.1 });
  const wing = new THREE.Mesh(wingGeo, wingMat);
  wing.position.set(-0.1, 0, 0.35);
  wing.castShadow = true;
  bird.add(wing);

  // Second wing (other side)
  const wing2 = new THREE.Mesh(wingGeo, wingMat);
  wing2.position.set(-0.1, 0, -0.35);
  wing2.castShadow = true;
  bird.add(wing2);

  // Tail - small cone pointing backward
  const tailGeo = new THREE.ConeGeometry(0.15, 0.3, 6);
  const tailMat = new THREE.MeshStandardMaterial({ color: 0xe8a020, roughness: 0.5 });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-0.6, 0.1, 0);
  tail.castShadow = true;
  bird.add(tail);

  return bird;
}

const bird = createBird();
bird.position.set(-2, 0, 0);
scene.add(bird);

// --- Bird Physics State ---
let birdVelocity = 0;
const gravity = -15;
const flapStrength = 6;
let gameStarted = false;

// --- Input ---
function flap() {
  birdVelocity = flapStrength;
  gameStarted = true;
}

window.addEventListener('click', flap);
window.addEventListener('touchstart', flap);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') flap();
});

// --- Tilt Animation ---
function updateBirdTilt() {
  const targetRotation = THREE.MathUtils.clamp(
    -birdVelocity * 0.08,
    -0.5,
    Math.PI / 3
  );
  bird.rotation.z = THREE.MathUtils.lerp(bird.rotation.z, targetRotation, 0.1);
}

// --- Wing Flap Animation ---
let wingTime = 0;
function updateWingFlap(delta) {
  wingTime += delta * 8;
  const wingAngle = Math.sin(wingTime) * 0.4;
  if (bird.children[4]) bird.children[4].rotation.x = wingAngle;
  if (bird.children[5]) bird.children[5].rotation.x = -wingAngle;
}

// --- 3D Pipes ---
const pipes = [];
const PIPE_SPEED = 5;
const PIPE_SPAWN_INTERVAL = 2;
const PIPE_GAP = 4;
const PIPE_RADIUS = 0.6;
const PIPE_LENGTH = 10;
const PIPE_SPAWN_X = 15;
const PIPE_REMOVE_X = -15;
let pipeTimer = 0;

const pipeMaterial = new THREE.MeshStandardMaterial({
  color: 0x58a828,
  metalness: 0.4,
  roughness: 0.3
});

const capMaterial = new THREE.MeshStandardMaterial({
  color: 0x68c038,
  metalness: 0.5,
  roughness: 0.25
});

function createPipePair() {
  const gapCenter = (Math.random() - 0.5) * 6;
  const group = new THREE.Group();

  // Bottom pipe
  const botGeo = new THREE.CylinderGeometry(PIPE_RADIUS, PIPE_RADIUS, PIPE_LENGTH, 16);
  const botPipe = new THREE.Mesh(botGeo, pipeMaterial);
  botPipe.position.y = gapCenter - PIPE_GAP / 2 - PIPE_LENGTH / 2;
  botPipe.castShadow = true;
  botPipe.receiveShadow = true;
  group.add(botPipe);

  // Bottom cap
  const capGeo = new THREE.CylinderGeometry(PIPE_RADIUS * 1.3, PIPE_RADIUS * 1.3, 0.4, 16);
  const botCap = new THREE.Mesh(capGeo, capMaterial);
  botCap.position.y = gapCenter - PIPE_GAP / 2;
  botCap.castShadow = true;
  group.add(botCap);

  // Top pipe
  const topPipe = new THREE.Mesh(botGeo, pipeMaterial);
  topPipe.position.y = gapCenter + PIPE_GAP / 2 + PIPE_LENGTH / 2;
  topPipe.castShadow = true;
  topPipe.receiveShadow = true;
  group.add(topPipe);

  // Top cap
  const topCap = new THREE.Mesh(capGeo, capMaterial);
  topCap.position.y = gapCenter + PIPE_GAP / 2;
  topCap.castShadow = true;
  group.add(topCap);

  group.position.x = PIPE_SPAWN_X;
  group.userData.passed = false;
  scene.add(group);
  pipes.push(group);
}

function updatePipes(delta) {
  pipeTimer += delta;
  if (pipeTimer >= PIPE_SPAWN_INTERVAL) {
    pipeTimer = 0;
    createPipePair();
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].position.x -= PIPE_SPEED * delta;
    if (pipes[i].position.x < PIPE_REMOVE_X) {
      scene.remove(pipes[i]);
      pipes.splice(i, 1);
    }
  }
}

// --- Game Loop ---
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const delta = (now - lastTime) / 1000;
  lastTime = now;
  if (delta > 0.1) { renderer.render(scene, camera); return; }

  if (gameStarted) {
    birdVelocity += gravity * delta;
    bird.position.y += birdVelocity * delta;
    updatePipes(delta);
  }

  updateBirdTilt();
  updateWingFlap(delta);

  renderer.render(scene, camera);
}

// --- Resize Handler ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
