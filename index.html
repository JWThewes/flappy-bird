<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird 3D</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x71c5cf);

// Camera - positioned for side-scrolling view
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 15);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 10, 7);
directionalLight.castShadow = true;
directionalLight.shadow.mapSize.width = 1024;
directionalLight.shadow.mapSize.height = 1024;
scene.add(directionalLight);

// Responsive resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Pipes
const pipes = [];
const PIPE_SPEED = 5;
const PIPE_SPAWN_INTERVAL = 2;
const PIPE_GAP = 4;
const PIPE_RADIUS = 0.6;
const PIPE_LENGTH = 10;
const PIPE_SPAWN_X = 15;
const PIPE_REMOVE_X = -15;
let pipeTimer = 0;

const pipeMaterial = new THREE.MeshStandardMaterial({
  color: 0x58a828,
  metalness: 0.4,
  roughness: 0.3
});

const capMaterial = new THREE.MeshStandardMaterial({
  color: 0x68c038,
  metalness: 0.5,
  roughness: 0.25
});

function createPipePair() {
  const gapCenter = (Math.random() - 0.5) * 6;
  const group = new THREE.Group();

  // Bottom pipe
  const botGeo = new THREE.CylinderGeometry(PIPE_RADIUS, PIPE_RADIUS, PIPE_LENGTH, 16);
  const botPipe = new THREE.Mesh(botGeo, pipeMaterial);
  botPipe.position.y = gapCenter - PIPE_GAP / 2 - PIPE_LENGTH / 2;
  botPipe.castShadow = true;
  botPipe.receiveShadow = true;
  group.add(botPipe);

  // Bottom cap
  const capGeo = new THREE.CylinderGeometry(PIPE_RADIUS * 1.3, PIPE_RADIUS * 1.3, 0.4, 16);
  const botCap = new THREE.Mesh(capGeo, capMaterial);
  botCap.position.y = gapCenter - PIPE_GAP / 2;
  botCap.castShadow = true;
  group.add(botCap);

  // Top pipe
  const topPipe = new THREE.Mesh(botGeo, pipeMaterial);
  topPipe.position.y = gapCenter + PIPE_GAP / 2 + PIPE_LENGTH / 2;
  topPipe.castShadow = true;
  topPipe.receiveShadow = true;
  group.add(topPipe);

  // Top cap
  const topCap = new THREE.Mesh(capGeo, capMaterial);
  topCap.position.y = gapCenter + PIPE_GAP / 2;
  topCap.castShadow = true;
  group.add(topCap);

  group.position.x = PIPE_SPAWN_X;
  group.userData.passed = false;
  scene.add(group);
  pipes.push(group);
}

function updatePipes(delta) {
  pipeTimer += delta;
  if (pipeTimer >= PIPE_SPAWN_INTERVAL) {
    pipeTimer = 0;
    createPipePair();
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].position.x -= PIPE_SPEED * delta;
    if (pipes[i].position.x < PIPE_REMOVE_X) {
      scene.remove(pipes[i]);
      pipes.splice(i, 1);
    }
  }
}

// Game loop
let lastTime = 0;
function animate(time) {
  requestAnimationFrame(animate);
  const delta = (time - lastTime) / 1000;
  lastTime = time;
  if (delta > 0.1) { renderer.render(scene, camera); return; }

  updatePipes(delta);

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
